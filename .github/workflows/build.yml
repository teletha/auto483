name: Build and Deploy

on:
  push:
    branches: [master, main, test*]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# enable pipeline error in shell
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: zulu
        java-version: 25

    - name: Cache bee local repository
      uses: actions/cache@v6
      with:
        path: ${{ env.JAVA_HOME }}/lib/bee/repository
        key: ${{ runner.os }}-bee-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-bee

    - name: Build artifact and site
      run: |
        if [ -e "bee" ]; then
          source bee install doc:site maven:pom ci:readme ci:license ci:release
        else
          version=$(curl -SsL https://git.io/stable-bee)
          curl -SsL -o bee-${version}.jar https://jitpack.io/com/github/teletha/bee/${version}/bee-${version}.jar
          java -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -cp bee-${version}.jar bee.Bee install doc:site maven:pom ci:readme ci:license
        fi

    # The steps below write to the repository. A pull request from a fork runs with a
    # read-only GITHUB_TOKEN, so a push there ends in a permission error, and a pull
    # request from a branch of this repository would only rewrite its merge candidate,
    # which is never merged. Therefore these steps run on pushes only.
    - name: Deploy site
      if: github.event_name != 'pull_request'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: target/site

    - name: Request Releasing
      if: github.event_name != 'pull_request'
      id: release
      uses: googleapis/release-please-action@v3.7.13
      with:
        release-type: simple
        package-name: auto483
        include-v-in-tag: false

    # The Release which the step above publishes is an event raised by the built-in
    # GITHUB_TOKEN, and such an event never starts a workflow run. This starts the
    # publish workflow from here instead, because a repository dispatch is one of
    # the only two events which the GITHUB_TOKEN may still raise a run with.
    # The version which was just released is given to the run through the payload.
    # Reading it from the checked out revision instead would read the version of
    # whatever the default branch holds when the run starts, and a manual run has
    # no payload and falls back to that revision with version.txt.
    - name: Notify the release workflow
      if: github.event_name != 'pull_request' && steps.release.outputs.release_created == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
          -f event_type=release \
          -f "client_payload[version]=${{ steps.release.outputs.version }}"

    - name: Auto commit
      if: github.event_name != 'pull_request'
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: update repository info
